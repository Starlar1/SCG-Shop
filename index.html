<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>အက်ပ် ခေတ္တပိတ်ထားပါသည်</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Pyidaungsu', 'Myanmar Text', 'Noto Sans Myanmar', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #1e1e2f 0%, #2a2a40 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3.5rem 1.5rem 3.5rem 1.5rem;
            padding: 3rem 2.2rem;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 
                        0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                        0 0 40px rgba(0, 180, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.3s ease;
            text-align: center;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 60px rgba(0, 0, 0, 0.8), 
                        0 0 0 1px rgba(255, 255, 255, 0.1) inset,
                        0 0 60px rgba(0, 200, 255, 0.3);
        }
        .emoji-badge {
            font-size: 4.5rem;
            line-height: 1;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 15px rgba(0, 200, 255, 0.7));
            animation: softPulse 2.5s infinite alternate;
        }
        @keyframes softPulse {
            0% { transform: scale(1); opacity: 0.9; }
            100% { transform: scale(1.06); opacity: 1; }
        }
        .mm-title {
            font-size: 2.4rem;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 0 20px #00a6ff, 0 0 5px #0077ff;
            letter-spacing: 1px;
            line-height: 1.4;
            margin-bottom: 1.8rem;
            word-break: break-word;
        }
        .mm-text {
            font-size: 1.7rem;
            font-weight: 500;
            color: #e0f0ff;
            text-shadow: 0 0 12px #0088cc, 0 0 3px #0055aa;
            line-height: 1.6;
            margin-bottom: 2.2rem;
            padding: 0 0.2rem;
            word-break: break-word;
        }
        .divider {
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00b4ff, #7f00ff, #00b4ff, transparent);
            margin: 1.8rem auto 1.8rem;
            border-radius: 10px;
            opacity: 0.8;
            box-shadow: 0 0 12px #00a6ff;
        }
        .footer-note {
            font-size: 1.1rem;
            color: #a0c0e0;
            letter-spacing: 1px;
            opacity: 0.9;
            font-weight: 300;
            text-shadow: 0 0 6px #003366;
        }
        .blink-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00ffaa;
            border-radius: 50%;
            margin: 0 6px 0 2px;
            box-shadow: 0 0 12px #00ffaa;
            animation: blink 1.8s infinite;
            vertical-align: middle;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        /* မိုဘိုင်းအတွက် ချိန်ညှိမှု */
        @media (max-width: 480px) {
            .card {
                padding: 2.2rem 1.2rem;
                border-radius: 2.5rem 1rem 2.5rem 1rem;
            }
            .mm-title {
                font-size: 1.9rem;
                margin-bottom: 1.2rem;
            }
            .mm-text {
                font-size: 1.4rem;
                margin-bottom: 1.6rem;
            }
            .emoji-badge {
                font-size: 3.8rem;
            }
            .footer-note {
                font-size: 0.95rem;
            }
            .divider {
                width: 90px;
                margin: 1.4rem auto;
            }
        }
        @media (max-width: 340px) {
            .mm-title {
                font-size: 1.6rem;
            }
            .mm-text {
                font-size: 1.25rem;
            }
            .emoji-badge {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- စာသားများသာ ပါဝင်သည် (အီမိုဂျီသည်လည်း စာသားအဖြစ် သတ်မှတ်နိုင်သည်) -->
        <div class="emoji-badge" aria-hidden="true">⏳</div>
        
        <div class="mm-title">
            အက်ပ်ကို ခေတ္တပိတ်ပင်ထားပါသည်
        </div>
        
        <div class="mm-text">
            မကြာမီ ပြန်ဖွင့်မည်
        </div>
        
        <div class="divider"></div>
        
        <div class="footer-note">
            <span class="blink-dot"></span> စောင့်ဆိုင်းပေးပါရန် <span class="blink-dot"></span>
        </div>
    </div>
</body>
</html>
